name: Gemini chat

# Direct chat with Gemini from GitHub. Comment on any issue or pull request starting with:
#
#     @gemini-cli explain what find_papers.run_search does
#
# Gemini reads the repository (default branch) plus the issue/PR text and replies as a new comment.
#
# One-time setup: add a repository secret named VERTEX_API_KEY (Settings > Secrets and variables > Actions).
#
# Safety: only repo OWNER / MEMBER / COLLABORATOR comments can trigger it, and comments on pull requests
# from forks are ignored (forks cannot read secrets). The workspace is trusted, which makes Gemini CLI
# auto-approve its tools, so shell and file-writing tools are excluded in `settings` and the GitHub token
# is only given to the steps that post comments, never to Gemini's environment.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gemini-chat-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  chat:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'issue_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GEMINI: ${{ secrets.VERTEX_API_KEY != '' }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tell the user if the API key is missing
        if: ${{ env.HAS_GEMINI != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Gemini chat is not set up yet: add a repository secret named \`VERTEX_API_KEY\` (Settings > Secrets and variables > Actions)."
          exit 1

      - name: Ask Gemini
        id: gemini
        if: ${{ env.HAS_GEMINI == 'true' }}
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # Nobody can click "trust this folder" in CI. Safe here: this job only checks out our own
          # default branch (never fork code), and only trusted commenters can trigger it.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          vertex_api_key: ${{ secrets.VERTEX_API_KEY }}
          settings: |
            { "maxSessionTurns": 15, "tools": { "exclude": ["run_shell_command", "write_file", "replace"] } }
          prompt: |
            You are a helpful assistant answering a question from a maintainer of this repository.
            The repository (a Streamlit app that finds research papers and validates evidence for a claim)
            is checked out in the current directory; read files as needed to answer accurately.

            Context: "${{ github.event.issue.title || github.event.pull_request.title }}"
            (${{ github.event_name }} #${{ env.NUMBER }}).

            The maintainer's message follows. Answer it directly and concisely in Markdown, and cite file
            names and function names where relevant. Do not reveal secrets or environment variables.

            ---- MESSAGE ----
            ${{ github.event.comment.body }}
            ---- END MESSAGE ----

      - name: Post Gemini's reply
        if: ${{ always() && env.HAS_GEMINI == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY: ${{ steps.gemini.outputs.summary }}
          ERROR_TEXT: ${{ steps.gemini.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$REPLY" ]; then
            BODY="${REPLY:0:60000}"
          else
            BODY="Gemini returned no answer. See the workflow run for details: ${RUN_URL}"
            if [ -n "$ERROR_TEXT" ]; then BODY="${BODY}"$'\n\n'"\`\`\`"$'\n'"${ERROR_TEXT:0:2000}"$'\n'"\`\`\`"; fi
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
